<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" xmlns:th="https://www.thymeleaf.org">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>BORRANDO ANIMAL!!!!!</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<header class="bg-dark text-white text-center p-4">
    <h1>¿Seguro deseas borrar este elemento? - Esto borrará los animales asociados a el</h1>
</header>


<ul>
    <li><span>Nombre: </span><span th:text="${family.getName()}"></span></li>
    <li><span>Id: </span><span th:text="${family.getId()}"></span></li>
</ul>

<form th:action="@{/families/familyDelete}" method="post">
    <input type="hidden" name="id" th:value="${family.id}">
    <button type="submit" class="btn btn-danger" th:href="@{/families}">Borrar</button>
</form>

<a class="btn btn-success" th:href="@{/families}">
    Volver
</a>


</body>
</html>
