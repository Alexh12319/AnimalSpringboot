<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Families Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>


<header class="bg-dark text-white text-center p-4">
    <h1>Detalles de familias</h1>
</header>

<ul>
    <li><span>Nombre: </span><span th:text="${family.getName()}"></span></li>
    <li><span>Id: </span><span th:text="${family.getId()}"></span></li>
</ul>

<a class="btn btn-success" th:href="@{/families}">Volver</a>

<header class="bg-dark text-white text-center p-4">
    <h2>Animales Asociados</h2>
    <ul>
        <li th:each="animal : ${family.getAnimals()}">
            <span th:text="${animal.getName()}"></span>
            vida media: <span th:text="${animal.getAverageLifeSpan()}"></span>
        </li>
    </ul>
</header>

</body>
</html>
