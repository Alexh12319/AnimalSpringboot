<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Families</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<header class="bg-dark text-white text-center p-4">
    <h1>Listado Families!!!! :D (^w^)</h1>
</header>

<a th:href="@{/families/familyCreate}">Create a new Family</a>

<table>
    <thead>
    <tr>
        <th>Id</th>
        <th>Nombre</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="family : ${families}" > <!--Lo paso aquí para no recorrerlo cada vez y así Detalles pilla el ID-->
        <td th:text="${family.getId()}"> </td>
        <td th:text="${family.getName()}"></td>
        <td><a class="btn btn-warning" th:href="@{/families/familyDetails/{id}(id=${family.getId()})}">Detalles</a></td>
        <td><a class="btn btn-success" th:href="@{/families/familyEdit/{id}(id=${family.getId()})}">Editar</a></td>
        <td><a class="btn btn-danger" th:href="@{/families/familyDelete/{id}(id=${family.getId()})}">Borrar</a></td>
    </tr>
    </tbody>
</table>

</body>
</html>
