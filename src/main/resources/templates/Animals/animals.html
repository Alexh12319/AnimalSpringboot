<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<header class="bg-dark text-white text-center p-4">
    <h1>Listado Animals</h1>
</header>

<a th:href="@{/animals/create}">Crear un nuevo Animal</a>


<table>
    <thead>
    <tr>
        <th>Id</th>
        <th>Nombre</th>
        <th>Vida Media</th>
        <th>Extinto</th>
        <th>Familia</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="animal : ${animales}" > <!--Lo paso aquí para no recorrerlo cada vez y así Detalles pilla el ID-->
        <td th:text="${animal.getId()}"> </td>
        <td th:text="${animal.getName()}"></td>
        <td th:text="${animal.getAverageLifeSpan()}"></td>
        <td th:text="${animal.getExtinct()}"></td>
        <td th:text="${animal.getFamily() != null} ? ${animal.getFamily().getName()} : '--'"></td>
        <td><a class="btn btn-warning" th:href="@{/animals/details/{id}(id=${animal.getId()})}">Detalles</a></td>
        <td><a class="btn btn-success" th:href="@{/animals/edit/{id}(id=${animal.getId()})}">Editar</a></td>
        <td><a class="btn btn-danger" th:href="@{/animals/delete/{id}(id=${animal.getId()})}">Borrar</a></td>
    </tr>
    </tbody>
</table>
<a th:href="@{/}">volver</a>
</body>
</html>
