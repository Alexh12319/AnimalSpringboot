<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Crea Nuevo Animal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<form action="#" th:action="@{/animals/create}"
                 th:object="${animal}"
      method="post">

        <!--Revisar si falla los actions-->

        <label for="name" class="from-label">Nombre:</label>
        <input class="form-control" type="text" id="name" th:field="*{name}">
        <br>
        <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
        <br>

        <label class="from-label">Vida media:</label>
        <input class="form-control" type="number" th:field="*{averageLifeSpan}">
        <br>
        <p th:if="${#fields.hasErrors('averageLifeSpan')}" th:errors="*{averageLifeSpan}"></p>
        <br>

        <label class="from-label">Extinto:</label>
        <input class="from-check-input" type="checkbox" th:field="*{extinct}">
        <br>
        <br>
        <input class="btn btn-success" type="submit" value="Crear">
</form>

</body>
</html>
