<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" xmlns:th="https://www.thymeleaf.org">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<header class="bg-dark text-white text-center p-4">
    <h1>Detalles de animales</h1>
</header>

<ul>
    <li><span>Nombre: </span><span th:text="${animal.getName()}"></span></li>
    <li><span>Id: </span><span th:text="${animal.getId()}"></span></li>
    <li><span>Vida media: </span><span th:text="${animal.getAverageLifeSpan()}"></span></li>
    <li><span>Extinto: </span><span th:text="${animal.getExtinct()}"></span></li>
</ul>

<a class="btn btn-success" th:href="@{/animals}">Volver</a>

</body>
</html>
